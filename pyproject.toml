[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tensemem"
version = "0.0.1"
description = "Memory that knows its tenses: an embedded, deterministic state memory engine for AI agents."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Shubham" }]
keywords = ["llm", "ai-agents", "memory", "temporal", "sqlite", "rag"]
classifiers = [
  "Development Status :: 1 - Planning",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Libraries",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://github.com/tensemem/tensemem"
Repository = "https://github.com/tensemem/tensemem"
Issues = "https://github.com/tensemem/tensemem/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/tensemem"]
